<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Catalog</title>
<meta name="description" content="Comics, galleries, posts, light novels and videos.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="icon menu-btn" id="menu" type="button" aria-label="Open menu">☰</button>
  <a href="#" class="logo" id="logo">My<span>Catalog</span></a>
  <form id="search-form" class="search" role="search">
    <input id="q" type="search" placeholder="Search…" autocomplete="off" aria-label="Search">
  </form>
  <div class="hright">
    <a class="btn alt adm-link" id="admin-link" href="admin.html" aria-label="Admin panel">🔒 <span>Admin</span></a>
    <div class="auth" id="auth"></div>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections"></nav>

<div class="layout" id="layout">
  <aside class="side" id="side" aria-label="Browse by type, genre, anime or character"></aside>

  <main>
    <h1 id="title" class="sr">Home</h1>
    <div id="content"></div>
    <p id="msg" class="msg" role="status"></p>
  </main>

  <aside class="notice" id="notice" hidden>
    <a id="notice-link" href="#"><span id="notice-media"></span></a>
  </aside>
</div>
<div class="backdrop" id="backdrop"></div>

<footer class="foot"><a href="admin.html">Admin</a></footer>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="icon close" id="close" aria-label="Close">✕</button>
    <img id="m-img" alt="">
    <div class="m-body">
      <span id="m-type"></span>
      <h2 id="m-title"></h2>
      <p class="meta" id="m-meta"></p>
      <div class="tags" id="m-tags"></div>
      <p id="m-desc" class="desc"></p>
      <div class="actions">
        <a class="btn" id="b-read" href="#" hidden>📖 Read</a>
      </div>
    </div>
  </div>
</div>

<script src="contenido.js"></script>
<script src="data.js"></script>
<script src="social.js"></script>
<script src="app.js"></script>
</body>
</html>
