<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<meta name="description" content="">
<link rel="stylesheet" href="style.css">
<style>
.rd-top{gap:10px;flex-wrap:wrap}
.rd-title{display:flex;flex-direction:column;min-width:0;flex:1}
.rd-title b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--text);padding:9px 14px;cursor:pointer;font-size:.88rem}
.seg button.on{background:var(--acc);color:#04241b;font-weight:700}
.info{max-width:820px;margin:0 auto;padding:18px 16px 4px}
.info .meta{margin:10px 0}
.video{max-width:820px;margin:12px auto 0;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#000}
.video iframe{width:100%;height:100%;border:0;display:block}
#view{padding:16px;max-width:1500px;margin:0 auto}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pg button{position:relative;border:0;padding:0;background:var(--panel);border-radius:var(--r);overflow:hidden;cursor:zoom-in}
.pg img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.pg .num{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font-size:.8rem;padding:2px 8px;border-radius:8px}
.more{display:block;margin:22px auto 0}
.hint2{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.wt{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:28px;background:var(--panel);padding:28px 0;border-radius:var(--r)}
.wt img{width:100%;display:block;background:var(--bg)}
.end{max-width:820px;margin:0 auto;padding:90px 16px 60px}
.end-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
.end-actions a,.end-actions button{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;cursor:pointer;font-size:.92rem}
.end-actions .liked{background:var(--acc2);color:#2a1800;border-color:var(--acc2);font-weight:700}
.end h2{font-size:1.15rem;margin:0 0 12px}
.cform{display:flex;gap:12px;align-items:flex-start;margin-bottom:22px}
.cform textarea{min-height:80px;resize:vertical;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
.cform .side{display:flex;flex-direction:column;gap:8px;flex:1}
.cform .side .btn{align-self:flex-start}
.cform .who{font-size:.85rem;color:var(--muted)}
.cprompt{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);text-align:center;margin-bottom:22px}
.cprompt .btn{margin-top:10px}
.cm{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cm .body{flex:1;min-width:0}
.cm .head{font-size:.85rem;color:var(--muted);margin-bottom:4px}
.cm .head b{color:var(--text);margin-right:8px}
.cm p{margin:0;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.cm .del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem;padding:0;margin-top:4px}
.notfound{text-align:center;padding:60px 16px}
.lb{position:fixed;inset:0;z-index:100;background:#000}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:pointer}
.stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;will-change:transform}
.lb-bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(#000a,#0000);color:#fff;z-index:2;pointer-events:none}
.lb-bar>*{pointer-events:auto}
.lb-bar .grp{display:flex;gap:6px}
.lb-bar button,.lb .nav{background:#000a;color:#fff;border:1px solid #fff3;border-radius:10px;min-width:42px;height:42px;font-size:1.15rem;cursor:pointer}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;font-size:1.8rem}
.lb .nav:disabled{opacity:.25;cursor:default}
.lb .prev{left:10px}.lb .next{right:10px}
.lb-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fffa;font-size:.8rem;z-index:2;pointer-events:none;padding:0 70px}
</style>
</head>
<body>
<header class="top rd-top">
  <a class="btn alt adm-link" href="./">← Back</a>
  <div class="rd-title"><b id="t">Loading…</b></div>
  <div class="seg" id="seg" hidden>
    <button id="m-normal" type="button">Standard</button>
    <button id="m-webtoon" type="button">Webtoon</button>
  </div>
  <div class="auth" id="auth"></div>
</header>

<section class="info" id="info" hidden>
  <span id="i-type"></span>
  <p class="meta" id="i-meta"></p>
  <div class="tags" id="i-tags"></div>
  <p class="desc" id="i-desc"></p>
</section>
<div class="video" id="video" hidden></div>

<main id="view"></main>

<section class="end" id="end" hidden>
  <div class="end-actions">
    <button id="like" type="button"><span id="like-txt">♡ Like</span> <span id="like-n">0</span></button>
    <span class="muted" style="font-size:.85rem">Share:</span>
    <a id="sh-x" target="_blank" rel="noopener noreferrer">X / Twitter</a>
    <a id="sh-rd" target="_blank" rel="noopener noreferrer">Reddit</a>
    <a id="sh-fb" target="_blank" rel="noopener noreferrer">Facebook</a>
    <button id="sh-copy" type="button">Copy link</button>
  </div>
  <h2>Comments</h2>
  <div id="cbox"></div>
  <div id="clist"></div>
</section>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="stage" id="stage"><img id="lb-img" alt="" draggable="false"></div>
  <div class="lb-bar">
    <span id="lb-count"></span>
    <div class="grp">
      <button id="z-out" type="button" aria-label="Zoom out">−</button>
      <button id="z-in" type="button" aria-label="Zoom in">+</button>
      <button id="z-reset" type="button" aria-label="Original size">1:1</button>
      <button id="fs" type="button" aria-label="Browser full screen">⛶</button>
      <button id="lb-close" type="button" aria-label="Close">✕</button>
    </div>
  </div>
  <button class="nav prev" id="lb-prev" type="button" aria-label="Previous">‹</button>
  <button class="nav next" id="lb-next" type="button" aria-label="Next">›</button>
  <div class="lb-hint">Click left: previous · click right: next · wheel: zoom · drag to pan</div>
</div>

<script src="contenido.js"></script>
<script src="data.js"></script>
<script src="social.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var SITE = window.SITE || {}, C = window.Catalog;
  var id = new URLSearchParams(location.search).get('id') || '';
  var item = null, pages = [], mode = 'normal';

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function shareUrl() { return location.origin + location.pathname + '?id=' + encodeURIComponent(id); }

  Social.mountAuth($('auth')); Social.init();

  C.load().then(function (all) {
    for (var i = 0; i < all.length; i++) if (all[i].id === id) { item = all[i]; break; }
    init();
  });

  function notFound() {
    $('t').textContent = 'Not found';
    var v = $('view'); v.innerHTML = '';
    var d = el('div', 'notfound'), a = el('a', 'btn', 'Back to home'); a.href = './';
    d.append(el('p', null, 'We could not find this post, or it has no pages yet.'), a); v.appendChild(d);
  }

  function setMeta(attr, key, val) {
    var m = document.querySelector('meta[' + attr + '="' + key + '"]');
    if (!m) { m = document.createElement('meta'); m.setAttribute(attr, key); document.head.appendChild(m); }
    m.setAttribute('content', val);
  }

  // Metadatos para buscadores. Los hashtags solo se usan aquí; nunca se muestran.
  function seo() {
    var desc = (item.desc || item.title).replace(/\s+/g, ' ').slice(0, 160);
    var kw = item.genres.concat(item.hashtags, [item.series, item.character, item.type]).filter(Boolean);
    var img = item.cover ? new URL(item.cover, location.href).href : '';
    setMeta('name', 'description', desc);
    setMeta('name', 'keywords', kw.join(', '));
    setMeta('property', 'og:title', item.title);
    setMeta('property', 'og:description', desc);
    setMeta('property', 'og:type', 'article');
    setMeta('property', 'og:url', shareUrl());
    if (img) { setMeta('property', 'og:image', img); setMeta('name', 'twitter:card', 'summary_large_image'); }
    var l = document.createElement('link'); l.rel = 'canonical'; l.href = shareUrl(); document.head.appendChild(l);
    var ld = { '@context': 'https://schema.org', '@type': 'CreativeWork', name: item.title, description: desc, url: shareUrl(), keywords: kw.join(', '), genre: item.genres };
    if (img) ld.image = img;
    if (item.series) ld.isPartOf = { '@type': 'CreativeWorkSeries', name: item.series };
    var s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
  }

  function init() {
    var yt = item ? C.youtubeId(item.video) : '';
    pages = item ? item.pages : [];
    if (!item || (!pages.length && !yt)) { notFound(); return; }
    $('t').textContent = item.title;
    document.title = item.title + ' · ' + (SITE.name || '') + (SITE.highlight || '');
    seo();

    var tb = el('span', 'badge-type', item.type); tb.style.setProperty('--c', C.typeColor(item.type));
    $('i-type').appendChild(tb);
    var meta = $('i-meta');
    function xl(text, k) { var a = el('a', 'xlink', text); a.href = './#' + k + '=' + encodeURIComponent(text); return a; }
    if (item.series) meta.append(el('b', null, 'Series: '), xl(item.series, 'series'));
    if (item.series && item.character) meta.appendChild(document.createTextNode('  ·  '));
    if (item.character) meta.append(el('b', null, 'Character: '), xl(item.character, 'character'));
    meta.hidden = !(item.series || item.character);
    item.genres.forEach(function (g) { var a = el('a', null, g); a.href = './#genre=' + encodeURIComponent(g); $('i-tags').appendChild(a); });
    $('i-desc').textContent = item.desc;
    $('info').hidden = false;

    if (yt) {
      var f = el('iframe'); f.src = 'https://www.youtube-nocookie.com/embed/' + yt; f.title = item.title; f.loading = 'lazy';
      f.allow = 'accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen'; f.allowFullscreen = true;
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      $('video').appendChild(f); $('video').hidden = false;
    }
    if (pages.length) {
      $('seg').hidden = false;
      mode = lsGet('lector:modo') === 'webtoon' ? 'webtoon' : 'normal';
      $('m-normal').onclick = function () { setMode('normal'); };
      $('m-webtoon').onclick = function () { setMode('webtoon'); };
      render();
    }
    $('end').hidden = false; setupEnd();
  }

  function setMode(m) { mode = m; lsSet('lector:modo', m); render(); window.scrollTo(0, 0); }

  function render() {
    $('m-normal').classList.toggle('on', mode === 'normal');
    $('m-webtoon').classList.toggle('on', mode === 'webtoon');
    var v = $('view'); v.innerHTML = '';
    if (mode === 'normal') {
      var PREVIEW = 15;
      var hint = el('p', 'hint2', 'Click an image to view it full screen.');
      var grid = el('div', 'pg');
      var thumb = function (src, i) {
        var b = el('button'); b.type = 'button'; b.setAttribute('aria-label', 'Open page ' + (i + 1));
        var im = el('img'); im.loading = 'lazy'; im.alt = 'Page ' + (i + 1); im.src = src;
        b.append(im, el('span', 'num', i + 1)); b.onclick = function () { openLb(i); }; return b;
      };
      pages.slice(0, PREVIEW).forEach(function (src, i) { grid.appendChild(thumb(src, i)); });
      v.append(hint, grid);
      if (pages.length > PREVIEW) {
        var more = el('button', 'btn alt more', 'See more (' + (pages.length - PREVIEW) + ')'); more.type = 'button';
        more.onclick = function () { for (var i = PREVIEW; i < pages.length; i++) grid.appendChild(thumb(pages[i], i)); more.remove(); };
        v.appendChild(more);
      }
    } else {
      var col = el('div', 'wt');
      pages.forEach(function (src, i) { var im = el('img'); im.loading = 'lazy'; im.decoding = 'async'; im.alt = 'Page ' + (i + 1); im.src = src; col.appendChild(im); });
      v.appendChild(col);
    }
  }

  // ---------- Like, compartir, comentarios ----------
  function setupEnd() {
    var url = shareUrl(), u = encodeURIComponent(url), t = encodeURIComponent(item.title);
    $('sh-x').href = 'https://twitter.com/intent/tweet?url=' + u + '&text=' + t;
    $('sh-rd').href = 'https://www.reddit.com/submit?url=' + u + '&title=' + t;
    $('sh-fb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + u;
    $('sh-copy').onclick = function () {
      var b = $('sh-copy');
      function ok() { b.textContent = 'Copied!'; setTimeout(function () { b.textContent = 'Copy link'; }, 1800); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, function () { prompt('Copy this link:', url); });
      else prompt('Copy this link:', url);
    };

    var likeBtn = $('like');
    function paintLike(info) {
      likeBtn.classList.toggle('liked', !!info.liked);
      $('like-txt').textContent = info.liked ? '♥ Liked' : '♡ Like';
      $('like-n').textContent = info.count;
    }
    likeBtn.onclick = function () {
      if (!Social.enabled) { Social.toast('Likes are not available yet.'); return; }
      if (!Social.user) { Social.promptSignIn('Sign in to like this post.'); return; }
      likeBtn.disabled = true;
      Social.toggleLike(id).then(paintLike).catch(function (e) { Social.toast(e.message); }).then(function () { likeBtn.disabled = false; });
    };

    function renderComposer() {
      var box = $('cbox'); box.innerHTML = '';
      if (!Social.enabled) { box.appendChild(el('div', 'cprompt', 'Comments are not available yet.')); return; }
      if (!Social.user || !Social.profile) {
        var p = el('div', 'cprompt', 'Sign in to join the conversation.');
        var b = el('button', 'btn', 'Sign in'); b.type = 'button'; b.onclick = function () { Social.promptSignIn(); };
        p.append(document.createElement('br'), b); box.appendChild(p); return;
      }
      var f = el('div', 'cform'), side = el('div', 'side');
      var ta = el('textarea'); ta.maxLength = 1000; ta.placeholder = 'Write a comment…'; ta.setAttribute('aria-label', 'Write a comment');
      var send = el('button', 'btn', 'Post comment'); send.type = 'button';
      var who = el('span', 'who', 'Commenting as ' + Social.profile.name);
      send.onclick = function () {
        send.disabled = true;
        Social.addComment(id, ta.value).then(function () { ta.value = ''; return loadComments(); })
          .catch(function (e) { Social.toast(e.message); }).then(function () { send.disabled = false; });
      };
      side.append(ta, send, who); f.append(Social.avatar(Social.profile, 40), side); box.appendChild(f);
    }

    function loadComments() {
      var list = $('clist');
      if (!Social.enabled) { list.innerHTML = ''; return Promise.resolve(); }
      return Social.comments(id).then(function (arr) {
        list.innerHTML = '';
        if (!arr.length) { list.appendChild(el('p', 'muted', 'No comments yet. Be the first!')); return; }
        arr.forEach(function (c) {
          var row = el('div', 'cm'), body = el('div', 'body'), head = el('div', 'head');
          head.append(el('b', null, c.profile.name), document.createTextNode(new Date(c.created).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })));
          body.append(head, el('p', null, c.text));
          if (Social.user && Social.user.uid === c.uid) {
            var d = el('button', 'del', 'Delete'); d.type = 'button';
            d.onclick = function () { Social.deleteComment(c.id).then(loadComments).catch(function (e) { Social.toast(e.message); }); };
            body.appendChild(d);
          }
          row.append(Social.avatar(c.profile, 40), body); list.appendChild(row);
        });
      }).catch(function (e) { console.warn(e); list.innerHTML = ''; list.appendChild(el('p', 'muted', 'Comments could not be loaded.')); });
    }

    Social.onChange(function () {
      renderComposer(); loadComments();
      if (Social.enabled) Social.likeInfo(id).then(paintLike).catch(function (e) { console.warn(e); });
    });
  }

  // ---------- Visor a pantalla completa ----------
  var lb = $('lb'), stage = $('stage'), img = $('lb-img');
  var cur = 0, s = 1, tx = 0, ty = 0, baseW = 0, baseH = 0, MAXZ = 8;
  function vw() { return stage.clientWidth; }
  function vh() { return stage.clientHeight; }
  function clampPos() {
    var w = baseW * s, h = baseH * s;
    tx = w <= vw() ? (vw() - w) / 2 : Math.min(0, Math.max(vw() - w, tx));
    ty = h <= vh() ? (vh() - h) / 2 : Math.min(0, Math.max(vh() - h, ty));
  }
  function apply() { img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')'; }
  function layout() {
    if (!img.naturalWidth) return;
    var f = Math.min(vw() / img.naturalWidth, vh() / img.naturalHeight);
    baseW = img.naturalWidth * f; baseH = img.naturalHeight * f;
    img.style.width = baseW + 'px'; img.style.height = baseH + 'px';
    s = 1; clampPos(); apply();
  }
  function zoomAt(px, py, factor) {
    var ns = Math.min(MAXZ, Math.max(1, s * factor)), r = ns / s;
    tx = px - (px - tx) * r; ty = py - (py - ty) * r; s = ns; clampPos(); apply();
  }
  function zoomCenter(f) { zoomAt(vw() / 2, vh() / 2, f); }
  function show(i) {
    cur = i; s = 1; img.onload = layout; img.src = pages[i];
    $('lb-count').textContent = (i + 1) + ' / ' + pages.length;
    $('lb-prev').disabled = i === 0; $('lb-next').disabled = i === pages.length - 1;
    if (pages[i + 1]) { var pre = new Image(); pre.src = pages[i + 1]; }
    if (img.complete && img.naturalWidth) layout();
  }
  function go(d) { var n = cur + d; if (n < 0 || n >= pages.length) return; show(n); }
  function openLb(i) { lb.hidden = false; document.body.style.overflow = 'hidden'; show(i); }
  function closeLb() { lb.hidden = true; document.body.style.overflow = ''; if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }
  $('lb-close').onclick = closeLb;
  $('lb-prev').onclick = function () { go(-1); };
  $('lb-next').onclick = function () { go(1); };
  $('z-in').onclick = function () { zoomCenter(1.4); };
  $('z-out').onclick = function () { zoomCenter(1 / 1.4); };
  $('z-reset').onclick = function () { s = 1; clampPos(); apply(); };
  $('fs').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (lb.requestFullscreen) lb.requestFullscreen().catch(function () {});
  };
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === '+' || e.key === '=') zoomCenter(1.4);
    else if (e.key === '-') zoomCenter(1 / 1.4);
    else if (e.key === '0') { s = 1; clampPos(); apply(); }
  });
  window.addEventListener('resize', function () { if (!lb.hidden) layout(); });
  document.addEventListener('fullscreenchange', function () { if (!lb.hidden) setTimeout(layout, 60); });
  stage.addEventListener('wheel', function (e) {
    e.preventDefault(); var r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.2 : 1 / 1.2);
  }, { passive: false });
  var ptrs = new Map(), startPan = null, pinch = null, moved = false;
  stage.addEventListener('pointerdown', function (e) {
    stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { startPan = { x: e.clientX, y: e.clientY, tx: tx, ty: ty }; moved = false; }
    else if (ptrs.size === 2) { var p = Array.from(ptrs.values()); pinch = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), s: s }; startPan = null; moved = true; }
  });
  stage.addEventListener('pointermove', function (e) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2 && pinch) {
      var p = Array.from(ptrs.values()), r = stage.getBoundingClientRect(), d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      zoomAt((p[0].x + p[1].x) / 2 - r.left, (p[0].y + p[1].y) / 2 - r.top, (pinch.s * d / pinch.d) / s);
    } else if (ptrs.size === 1 && startPan) {
      var dx = e.clientX - startPan.x, dy = e.clientY - startPan.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
      if (moved && s > 1) { tx = startPan.tx + dx; ty = startPan.ty + dy; clampPos(); apply(); }
    }
  });
  stage.addEventListener('pointerup', function (e) {
    var single = ptrs.size === 1; ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (single && startPan && !moved) { var r = stage.getBoundingClientRect(); if (e.clientX - r.left < r.width * 0.35) go(-1); else go(1); }
    if (ptrs.size === 0) startPan = null;
  });
  stage.addEventListener('pointercancel', function (e) { ptrs.delete(e.pointerId); pinch = null; startPan = null; });
})();
</script>
</body>
</html>
